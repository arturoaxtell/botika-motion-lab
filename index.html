<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Botika Motion Lab</title><style>
:root{--g:#16835e;--dark:#064a36}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--dark);font-family:Inter,system-ui,-apple-system,sans-serif}header{max-width:1200px;margin:auto;padding:42px 24px 24px}h1{font-size:clamp(30px,5vw,52px);letter-spacing:-.05em;margin:0}p{color:#638077}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}button,select{background:#fff;border:1px solid #d9e8e1;border-radius:12px;padding:10px 16px;color:var(--dark);font:inherit;cursor:pointer}button:hover{background:#eef8f3}main{max-width:1200px;margin:auto;padding:16px 24px 70px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{border:1px solid #e9f0eb;border-radius:24px;padding:20px 10px;text-align:center;position:relative;min-width:0}.num{position:absolute;top:15px;left:16px;font-weight:700;color:#81a99a}.stage{height:170px;display:grid;place-items:center}.mascot{width:145px;overflow:visible;filter:drop-shadow(0 9px 7px #083c2516);transform-origin:center 80%;animation:bob 2.5s ease-in-out infinite}.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}.arm{transform-box:fill-box;transform-origin:center;animation:wave 1.5s ease-in-out infinite alternate}.prop{transform-box:fill-box;transform-origin:center;animation:pop 2s ease-in-out infinite}.card:nth-child(2n) .mascot{animation:tilt 2.4s ease-in-out infinite alternate}.card:nth-child(3n) .prop{animation:spin 4s linear infinite}.card:nth-child(4n) .mascot{animation:bob 1.5s ease-in-out infinite}.card:nth-child(5n) .arm{animation:wave .7s ease-in-out infinite alternate}.card:nth-child(7n) .mascot{animation:tilt 1.8s ease-in-out infinite alternate}h2{font-size:15px;margin:4px 0 6px}small{color:#70867e;line-height:1.5;display:block;min-height:35px;padding:0 8px}.paused *, .paused *:before{animation-play-state:paused!important}@keyframes bob{50%{transform:translateY(-10px)}}@keyframes tilt{to{transform:rotate(9deg) translateY(-5px)}}@keyframes wave{to{transform:rotate(-30deg) translateY(-8px)}}@keyframes blink{0%,94%,98%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes pop{50%{transform:translateY(-8px) scale(1.07)}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:850px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){main{gap:9px;padding:10px}.card{padding:14px 3px}.stage{height:145px}.mascot{width:115px}header{padding:26px 18px}h2{font-size:13px}small{font-size:11px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.mascot .eye{animation:eye-look 3.3s ease-in-out infinite,blink 5.3s infinite;transform-box:fill-box;transform-origin:center}.card:nth-child(3n) .eye{animation-delay:-1.1s,-2.4s}.card:nth-child(4n) .eye{animation-delay:-2.2s,-.7s}.mascot .prop{animation:prop-dance 1.8s ease-in-out infinite}.card:nth-child(2n) .prop{animation:prop-orbit 2.4s ease-in-out infinite}.card:nth-child(3n) .prop{animation:prop-dance 1.3s ease-in-out infinite}.mascot .arm:nth-of-type(2){animation-delay:-.7s}.card:hover .mascot{animation-duration:.65s!important}.card:hover .eye{animation-duration:1.3s,3s!important}@keyframes eye-look{0%,15%,100%{translate:0 0}28%,40%{translate:5px -2px}52%,65%{translate:-5px 1px}78%,87%{translate:0 -3px}}@keyframes prop-dance{0%,100%{transform:translateY(0) rotate(-8deg) scale(1)}50%{transform:translateY(-13px) rotate(12deg) scale(1.12)}}@keyframes prop-orbit{0%,100%{transform:translate(-3px,3px) rotate(-10deg)}50%{transform:translate(6px,-12px) rotate(15deg)}}@media(prefers-reduced-motion:reduce){.eye,.prop{animation:none!important}}</style><header><div style="font-weight:800;color:#16835e;letter-spacing:.16em;font-size:12px">BOTIKA / CHARACTER SYSTEM</div><h1>Motion Lab <span style="color:#16835e">✳</span></h1><p>16 movimientos para el asistente Botika. Una mascota, muchas expresiones.</p><div class="toolbar"><button id="toggle">⏸ Pausar animaciones</button><label>Velocidad <select id="speed"><option value=".5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option><option value="2">2×</option></select></label></div></header><main id="grid"></main><script>
const entries=[["Te da la bienvenida","y se presenta en la app.","✦"],["Busca medicamentos","en tu inventario.","⌕"],["Identifica medicamentos","con IA (foto o nombre).","💊"],["Te recuerda","tus horarios de toma.","◷"],["Responde tus dudas","sobre medicamentos y tratamientos.","···"],["Te avisa","de vencimientos y stock bajo.","!"],["Gestiona","tu inventario y registros.","☑"],["Te apoya","con tus tratamientos.","♥"],["Te recomienda","alternativas y equivalentes.","✧"],["Escanea","y reconoce medicamentos.","▣"],["Te entrega","información clara y confiable.","≡"],["Cuida","tu salud y seguridad.","✓"],["Se despide","y te acompaña siempre.","↗"],["Aclara","lo que necesites.","?"],["Aprende","de tus hábitos y preferencias.","▂▅▇"],["Siempre disponible","cuando lo necesites.","◉"]];

oke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M9 18h6M10 21h4M8 14c-5-5-1-11 4-11s9 6 4 11l-1 3H9z'/></svg>","<svg viewBox=\"0 0 24 24\" width=\"29\" height=\"29\" fill=\"none\" stroke=\"#16835e\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x='3' y='6' width='18' height='14' rx='3'/><circle cx='12' cy='13' r='4'/><path d='M8 6 9 3h6l1 3'/></svg>","<svg viewBox=\"0 0 24 24\" width=\"29\" height=\"29\" fill=\"none\" stroke=\"#16835e\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M6 3h9l4 4v14H6zM14 3v5h5M9 12h7M9 16h7'/></svg>","<svg viewBox=\"0 0 24 24\" width=\"29\" height=\"29\" fill=\"none\" stroke=\"#16835e\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M12 2 4 6v6c0 5 4 8 8 10 4-2 8-5 8-10V6zM8 12l3 3 5-6'/></svg>","<svg viewBox=\"0 0 24 24\" width=\"29\" height=\"29\" fill=\"none\" stroke=\"#16835e\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M4 12h14m-5-5 5 5-5 5'/></svg>","<svg viewBox=\"0 0 24 24\" width=\"29\" height=\"29\" fill=\"none\" stroke=\"#16835e\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M9 9a3 3 0 1 1 5 2c-2 1-2 2-2 4M12 19h.01'/></svg>","<svg viewBox=\"0 0 24 24\" width=\"29\" height=\"29\" fill=\"none\" stroke=\"#16835e\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d='M4 20V13h4v7M10 20V8h4v12M16 20V3h4v17'/></svg>","<svg viewBox=\"0 0 24 24\" width=\"29\" height=\"29\" fill=\"none\" stroke=\"#16835e\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx='12' cy='12' r='8'/><path d='M12 7v5l3 2M12 2v2'/></svg>"];
const grid=document.getElementById("grid");
entries.forEach(([title,sub,symbol],i)=>{const happy=[0,2,6,7,9,11,12,14,15].includes(i);grid.insertAdjacentHTML("beforeend",`<article class="card"><span class="num">${i+1}</span><div class="stage"><svg class="mascot" viewBox="0 0 180 185" role="img" aria-label="Botika: ${title}"><defs><linearGradient id="green${i}" x2=".8" y2="1"><stop stop-color="#50bb8a"/><stop offset="1" stop-color="#087650"/></linearGradient><clipPath id="clip${i}"><rect x="25" y="32" width="130" height="132" rx="61"/></clipPath></defs><path d="M86 36V20H69" stroke="#177e59" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/><ellipse class="arm" cx="20" cy="111" rx="14" ry="19" fill="#22986b"/><ellipse class="arm" cx="160" cy="111" rx="14" ry="19" fill="#22986b"/><rect x="25" y="32" width="130" height="132" rx="61" fill="#f9faf7"/><g clip-path="url(#clip${i})"><path d="M19 106Q90 100 161 105V172H19Z" fill="url(#green${i})"/></g><rect x="44" y="65" width="93" height="65" rx="23" fill="#fff" stroke="#e5ece7" stroke-width="2"/>${happy?'<path class="eye" d="M65 99q9 -15 18 0M100 99q9 -15 18 0" fill="none" stroke="#07533d" stroke-width="7" stroke-linecap="round"/>':'<rect class="eye" x="66" y="88" width="9" height="22" rx="5" fill="#07533d"/><rect class="eye" x="106" y="88" width="9" height="22" rx="5" fill="#07533d"/>'}<g class="prop"><circle cx="146" cy="45" r="22" fill="#e3f7ec" stroke="#16835e" stroke-width="2"/><svg x="132" y="31" width="28" height="28" viewBox="0 0 29 29">${iconSet[i]}</svg></g></svg></div><h2>${title}</h2><small>${sub}</small></article>`)});let playing=true;document.getElementById("toggle").onclick=()=>{playing=!playing;document.body.classList.toggle("paused",!playing);document.getElementById("toggle").textContent=playing?"⏸ Pausar animaciones":"▶ Reproducir animaciones"};document.getElementById("speed").onchange=e=>{document.querySelectorAll(".mascot,.eye,.arm,.prop").forEach(el=>el.style.animationDuration=(parseFloat(getComputedStyle(el).animationDuration)*parseFloat(el.dataset.speed||1)/parseFloat(e.target.value))+"s");document.querySelectorAll(".mascot,.eye,.arm,.prop").forEach(el=>el.dataset.speed=e.target.value)};
</script></html>
